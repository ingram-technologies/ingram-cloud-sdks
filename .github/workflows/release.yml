name: Release

# A push to main that changes a package.json or this file publishes each version npm lacks and
# tags the commit `<dir>@<version>`. Re-run a failed run to retry. npm trusted
# publishing names this file per package: renaming it breaks publish.

on:
    push:
        branches: [main]
        paths: [packages/*/package.json, .github/workflows/release.yml]

permissions:
    contents: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: bun install --frozen-lockfile
            - run: bun run ci
            - name: Publish and tag
              run: |
                  failed=0
                  for package in packages/*; do
                    name="$(jq -r .name "$package/package.json")"
                    version="$(jq -r .version "$package/package.json")"
                    tag="${package#packages/}@$version"
                    [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] || npm publish "./$package" || { failed=1; continue; }
                    git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null || { git tag "$tag" && git push origin "$tag"; } || failed=1
                  done
                  exit "$failed"
